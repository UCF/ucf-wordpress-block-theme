name: Update visual baselines

# Manually-triggered: regenerates the Linux visual-regression baselines against a
# freshly-seeded wp-env and commits them back to the branch you ran it from.
# Run this after an intentional, reviewed layout change (or to create the initial
# Linux baselines).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-baselines:
    name: Regenerate & commit baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build

      - name: Start wp-env
        run: npx wp-env start

      - name: Seed content
        run: bash tests/seed.sh

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Regenerate baselines
        run: npm run test:visual:update
        env:
          CI: true
          TEST_BASE_URL: http://localhost:8888

      - name: Commit & push updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.js-snapshots
          if git diff --staged --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore: update Linux visual regression baselines [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi